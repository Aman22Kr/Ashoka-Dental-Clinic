  <body class="bg-[#f8faf9] text-slate-800 antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
    <script>
      // Single Page Apps for GitHub Pages redirect decoder
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
